---
layout: default
title: Blog
permalink: /blog/
---

<div class="site-container">
  <h1>Blog</h1>
  <div class="post-list">
    {% for post in site.posts %}
      <a href="{{ post.url | prepend: site.baseurl }}" class="post-row">
        <p class="post-date">{{ post.date | date: "%B %-d, %Y" }}</p>
        <h3>{{ post.title }}</h3>
        <p class="post-excerpt">{{ post.content | strip_html | truncatewords: 40 }}</p>
      </a>
    {% endfor %}
  </div>
</div>
