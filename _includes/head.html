<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- Google Scholar / Highwire Press citation metadata (posts only) -->
  {% if page.layout == "post" %}
  {% assign cite_author = page.author | default: site.author %}
  <meta name="citation_title" content="{{ page.title | strip_html | xml_escape }}">
  <meta name="citation_author" content="{{ cite_author | xml_escape }}">
  <meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
  <meta name="citation_online_date" content="{{ page.date | date: '%Y/%m/%d' }}">
  <meta name="citation_journal_title" content="sourabhmadur.github.io">
  <meta name="citation_publisher" content="sourabhmadur.github.io">
  <meta name="citation_abstract_html_url" content="{{ page.url | absolute_url }}">
  <meta name="citation_fulltext_html_url" content="{{ page.url | absolute_url }}">
  <meta name="citation_language" content="en">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      var theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>

<!-- Load up MathJax script if needed ... specify in /_data/options.yml file-->
  {% if site.data.options.mathjax %}
    <script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

  <link rel="stylesheet" type="text/css" href="{{ "/css/minimal.css" | prepend: site.baseurl }}">
  <!-- <link rel="stylesheet" type="text/css" href="{{ "/css/print.css" | prepend: site.baseurl }}" media="print"> -->

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
</head>
